# Auto-close OPEN MoveMatch gameweek after FPL first-kickoff deadline.
# Hits production API every 5 minutes (Vercel Hobby cannot run sub-daily crons).
#
# Required GitHub secret:
#   CRON_SECRET — same value as Vercel Production CRON_SECRET
#
# Optional repo Variables:
#   AUTO_CLOSE_URL — default https://www.form8.football/api/cron/close-gameweek
#
# Successful "nothing to close" runs return ok:true + action:skipped (green).
# Failures (auth / RPC / close tx) are real — check the step log body.

name: Auto-close gameweek

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no on-chain close)"
        type: boolean
        default: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call close-gameweek cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ vars.AUTO_CLOSE_URL || 'https://www.form8.football/api/cron/close-gameweek' }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub secret CRON_SECRET"
            echo "Add it under Settings → Secrets and variables → Actions"
            exit 1
          fi
          URL="$BASE_URL"
          if [ "$DRY" = "1" ]; then
            URL="${URL}?dryRun=1"
          fi
          echo "GET $URL"
          # Capture body even on non-2xx so logs show the API error.
          HTTP=$(curl -sS -o /tmp/auto-close.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" "$URL" || true)
          echo "HTTP $HTTP"
          cat /tmp/auto-close.json || true
          echo
          HTTP_CODE="$HTTP" python3 - <<'PY'
          import json, os
          http = int(os.environ.get("HTTP_CODE") or "0")
          raw = open("/tmp/auto-close.json").read().strip()
          if not raw:
            print("empty response body")
            raise SystemExit(1)
          try:
            data = json.loads(raw)
          except json.JSONDecodeError as e:
            print("non-JSON response:", raw[:500])
            raise SystemExit(1) from e
          print("action:", data.get("action"), "ok:", data.get("ok"), "reason:", data.get("reason"))
          if http >= 400 or data.get("ok") is False:
            print("error:", data.get("error") or data)
            raise SystemExit(1)
          PY
