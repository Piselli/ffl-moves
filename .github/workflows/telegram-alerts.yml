# FORM8 Telegram alert bot — registration / deadline / claim broadcasts.
# Hits production API. Same CRON_SECRET as other auto-* workflows.
#
# Required GitHub secret:
#   CRON_SECRET — same value as Vercel Production CRON_SECRET
#
# Optional repo Variables:
#   TELEGRAM_ALERTS_URL — default https://www.form8.football/api/cron/telegram-alerts
#
# Also requires Vercel env: TELEGRAM_BOT_TOKEN, UPSTASH_REDIS_REST_*, TELEGRAM_ALERTS_ENABLED
#
# Reliability: GH schedule still lags hours. Once ANY successful poke lands inside
# ~25h of kickoff, the API self-chains through 24h/12h/3h/1h. This workflow is the
# cold-start wake-up; traffic watchdog is the other. For a hard guarantee without
# Vercel Pro, also ping the same URL every 5–15 min from cron-job.org (Bearer secret).

name: Telegram alerts

on:
  schedule:
    # Every 5 min. Often delayed — still useful as the first poke that arms self-chain.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (claim slots / report, no broadcast)"
        type: boolean
        default: false
      unstick:
        description: "Release stuck slot(s) then send (e.g. deadline_24h)"
        type: string
        required: false
      announce:
        description: "One-shot news (injuries)"
        type: string
        required: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call telegram-alerts cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ vars.TELEGRAM_ALERTS_URL || 'https://www.form8.football/api/cron/telegram-alerts' }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          UNSTICK: ${{ github.event_name == 'workflow_dispatch' && inputs.unstick || '' }}
          ANNOUNCE: ${{ github.event_name == 'workflow_dispatch' && inputs.announce || '' }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing GitHub secret CRON_SECRET"
            exit 1
          fi
          URL="$BASE_URL"
          QS=""
          if [ "$DRY" = "1" ]; then
            QS="${QS}dryRun=1&"
          fi
          if [ -n "${UNSTICK:-}" ]; then
            QS="${QS}unstick=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["UNSTICK"]))')&"
          fi
          if [ -n "${ANNOUNCE:-}" ]; then
            QS="${QS}announce=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote(os.environ["ANNOUNCE"]))')&"
          fi
          if [ -n "$QS" ]; then
            URL="${URL}?${QS}"
          fi
          echo "GET $URL"
          HTTP=$(curl -sS -o /tmp/tg-alerts.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" "$URL" || true)
          echo "HTTP $HTTP"
          cat /tmp/tg-alerts.json || true
          echo
          HTTP_CODE="$HTTP" python3 - <<'PY'
          import json, os
          http = int(os.environ.get("HTTP_CODE") or "0")
          raw = open("/tmp/tg-alerts.json").read().strip()
          if not raw:
            print("empty response body")
            raise SystemExit(1)
          try:
            data = json.loads(raw)
          except json.JSONDecodeError as e:
            print("non-JSON response:", raw[:500])
            raise SystemExit(1) from e
          print("ok:", data.get("ok"), "skipped:", data.get("skipped"), "subs:", data.get("subscribers"), "fired:", len(data.get("fired") or []))
          if http >= 400 or data.get("ok") is False:
            print("error:", data.get("error") or data)
            raise SystemExit(1)
          PY
